version: '3.8'

services:
  consul:
    image: hashicorp/consul:1.19
    container_name: lab-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -server -ui -node=lab-consul -bootstrap-expect=1 -client=0.0.0.0"
    networks:
      - lab-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: lab-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Caps RAM usage at 512MB
    ports:
      - "9200:9200"
    volumes:
      - es_lab_data:/usr/share/elasticsearch/data
    networks:
      - lab-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: lab-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - lab-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: lab-logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch
    networks:
      - lab-network

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: lab-filebeat
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - lab-network

volumes:
  es_lab_data:

networks:
  lab-network:
    name: lab-network
    driver: bridge
